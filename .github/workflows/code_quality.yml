name: Code Quality

on:  
  push:
    branches: ["develop"]

permissions:
  contents: read
  security-events: write  # to upload SARIF results
  
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "src"
  cancel-in-progress: false

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest    

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install project dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system ruff mypy coverage

      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/test" >> "$GITHUB_ENV"

      - name: Run Ruff linting
        run: |
          ruff check . --output-format sarif --output-file ruff.sarif
        continue-on-error: true  
        
      - name: codeql-init      
        uses: github/codeql-action/init@v3
        with:
          languages: python
      
      - name: codeql-analyze   
        uses: github/codeql-action/analyze@v3
      
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ruff.sarif     

      - name: Run tests with coverage
        run: |
          coverage run --source=src -p "test/pandaict_test.py"
      - name: Create coverage reports
        run: |
          coverage report -m
          coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml